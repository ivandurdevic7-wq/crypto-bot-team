name: Crypto Bot Team
      - name: Save virtual results
        run: |name: Crypto Bot Team

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
          git config user.name "crypto-bot-team[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update virtual bot status"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-bot-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scan virtual market
        run: python app.py
      - name: Save virtual results
        run: |
          git config user.name "crypto-bot-team[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update virtual bot status"
            git push
          fi
