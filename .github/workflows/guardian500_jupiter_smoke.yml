name: Cuvar 500 Jupiter API smoke test (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quote-only:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read-only SOL quote API check
        env:
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
        run: python guardian500/jupiter_api_smoke.py
