name: Free Whale Watch BNB research
on:
  push:
    branches: [cuvar500-free-whale-watch-20261028]
    paths: ['guardian500/free_whale_watch.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python guardian500/test_free_whale_watch.py
      - run: python guardian500/free_whale_watch.py
