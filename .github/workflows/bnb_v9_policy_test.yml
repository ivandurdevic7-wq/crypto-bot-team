name: BNB MASTER 9 - Policy Test
on:
  push:
    branches: [bnb-master-v9-paper-prototype]
    paths:
      - bnb_master_v9_policy.py
      - .github/workflows/bnb_v9_policy_test.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile bnb_master_v9_policy.py
      - run: python bnb_master_v9_policy.py
      - name: Assert PAPER autonomy and LIVE disabled
        run: |
          python - <<'PY'
          import bnb_master_v9_policy as m
          assert m.START_EUR == 200
          assert m.AUTONOMOUS_PAPER is True
          assert m.LIVE_ENABLED is False
          p = {'equity_eur':200,'cash_eur':200,'open_positions':0,'daily_loss_pct':0,'weekly_loss_pct':0,'loss_streak':0}
          d = m.decide({}, {}, p)
          assert d['action'] == 'SKIP'
          assert d['data_gaps']
          print('V9 autonomy policy PASS; missing data => SKIP; LIVE blocked')
          PY
