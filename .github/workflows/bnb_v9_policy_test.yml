name: BNB MASTER 9 - Policy Test
on:
  push:
    branches: [bnb-master-v9-paper-prototype]
    paths:
      - bnb_master_v9_policy.py
      - .github/workflows/bnb_v9_policy_test.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile bnb_master_v9_policy.py
      - run: python bnb_master_v9_policy.py
