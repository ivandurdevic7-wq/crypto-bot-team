name: Cuvar500 fair strategy comparison
on:
  push:
    branches: [cuvar500-volume-retest-research-20261027]
    paths: ['guardian500/compare_strategies.py', 'guardian500/test_compare_strategies.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s guardian500 -p 'test_compare_strategies.py' -v
      - run: python guardian500/compare_strategies.py
