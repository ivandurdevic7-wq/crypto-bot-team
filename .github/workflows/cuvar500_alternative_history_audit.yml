name: Cuvar500 alternative hourly data audit
on:
  push:
    branches: [cuvar500-alternative-history-audit-20261027]
    paths: ['guardian500/alternative_history_audit.py','guardian500/test_alternative_history_audit.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s guardian500 -p test_alternative_history_audit.py -v
      - run: python guardian500/alternative_history_audit.py
