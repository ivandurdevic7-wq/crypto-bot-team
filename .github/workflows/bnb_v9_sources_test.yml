name: BNB V9 - Dual Security Feed Test
on:
  push:
    branches: [bnb-master-v9-paper-prototype]
    paths: [bnb_v9_security_sources.py, .github/workflows/bnb_v9_sources_test.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile bnb_v9_security_sources.py
      - run: python bnb_v9_security_sources.py
