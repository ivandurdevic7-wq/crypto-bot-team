name: Cuvar500 shared 500 USDT PAPER comparison
on:
  push:
    branches: [cuvar500-shared-portfolio-research-20261027]
    paths: ['guardian500/shared_portfolio_research.py','guardian500/test_shared_portfolio_research.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s guardian500 -p test_shared_portfolio_research.py -v
      - run: python guardian500/shared_portfolio_research.py
