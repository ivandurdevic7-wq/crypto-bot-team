name: Cuvar500 trade edge PAPER audit
on:
  push:
    branches: [cuvar500-trade-edge-audit-20261027]
    paths: ['guardian500/trade_edge_audit.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python guardian500/trade_edge_audit.py
