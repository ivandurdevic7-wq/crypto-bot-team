name: Cuvar 500 Solana token research (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read-only two-token quote research
        env:
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
        run: python guardian500/solana_token_research.py
