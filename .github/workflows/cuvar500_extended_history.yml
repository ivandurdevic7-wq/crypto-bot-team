name: Cuvar500 extended public-data PAPER comparison
on:
  push:
    branches: [cuvar500-extended-history-20261027]
    paths: ['guardian500/extended_history_research.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extended:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare BTC ETH SOL on 90 days of public historical prices
        run: python guardian500/extended_history_research.py
