name: Whale bounded live observation
on:
  push:
    branches: [cuvar500-dex-swap-validation-20261028]
    paths: ['guardian500/whale_live_probe.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python guardian500/whale_live_probe.py
