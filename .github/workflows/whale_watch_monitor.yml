name: Whale Watch bounded research snapshot
on:
  workflow_dispatch:
  push:
    branches: [cuvar500-dex-swap-validation-20261028]
    paths: ['guardian500/whale_watch_monitor.py']
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python guardian500/test_whale_watch_monitor.py
      - run: python guardian500/whale_watch_monitor.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whale-watch-research-snapshot
          path: guardian500/whale_watch_snapshot.json
          if-no-files-found: ignore
          retention-days: 7
