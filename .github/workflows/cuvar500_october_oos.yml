name: Cuvar500 October out-of-sample PAPER strategy
on:
  push:
    branches: [cuvar500-btc-filter-oos-20261027]
    paths: ['guardian500/october_oos_comparison.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python guardian500/october_oos_comparison.py
