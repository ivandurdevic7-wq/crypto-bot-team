name: BNB MASTER TEAM 7 - Paper Trading

on:
  pull_request:
    paths:
      - 'bnb_master.py'
      - '.github/workflows/bnb_scan.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: bnb-master-paper-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scan BNB paper market
        run: python bnb_master.py
      - name: Save BNB virtual status on main only
        if: ${{ success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bnb_status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update BNB paper trading status"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
