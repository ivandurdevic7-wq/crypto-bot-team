name: Cuvar500 pullback PAPER historical research
on:
  push:
    branches: [cuvar500-pullback-paper-research-20261027]
    paths: ['guardian500/pullback_research.py','guardian500/test_pullback_research.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s guardian500 -p test_pullback_research.py -v
      - run: python guardian500/pullback_research.py
