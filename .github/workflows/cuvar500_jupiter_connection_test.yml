name: Cuvar 500 Jupiter API connection test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Solana quote without transactions
        env:
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
        shell: bash
        run: |
          python - <<'PY'
          import os, json, urllib.parse, urllib.request
          key=os.environ.get('JUPITER_API_KEY','')
          if not key:
              raise SystemExit('FAIL: JUPITER_API_KEY secret missing')
          params=urllib.parse.urlencode({'inputMint':'EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v','outputMint':'So11111111111111111111111111111111111111112','amount':'1000000'})
          req=urllib.request.Request('https://api.jup.ag/swap/v2/order?'+params,headers={'x-api-key':key,'User-Agent':'Cuvar500-PAPER-Check'})
          try:
              with urllib.request.urlopen(req,timeout=12) as response:
                  data=json.loads(response.read(131073))
              if data.get('inputMint')!='EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v' or data.get('outputMint')!='So11111111111111111111111111111111111111112' or not str(data.get('outAmount','')).isdigit():
                  raise ValueError('Quote response invalid')
              if data.get('transaction') is not None:
                  raise ValueError('Not quote-only response')
              print('SUCCESS: read-only Jupiter quote received; no trades performed')
          except Exception as exc:
              print('FAIL: quote check:',type(exc).__name__)
              raise SystemExit(1)
          PY
