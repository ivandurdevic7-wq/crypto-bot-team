name: Cuvar500 historical Kraken PAPER research
on:
  workflow_dispatch:
  push:
    branches: [cuvar500-historical-backtest-20261027]
    paths: ['guardian500/kraken_historical_research.py']
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read-only historical BTC ETH SOL simulation
        run: python guardian500/kraken_historical_research.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cuvar500-historical-research
          path: guardian500/historical_research_result.json
          if-no-files-found: ignore
