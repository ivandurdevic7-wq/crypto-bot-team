name: BNB MASTER 9 - Integrated PAPER Cycle Test
on:
  push:
    branches: [bnb-master-v9-paper-prototype]
    paths: [bnb_v9_cycle.py, .github/workflows/bnb_v9_cycle_test.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile bnb_v9_cycle.py
      - run: python bnb_v9_cycle.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bnb-v9-cycle-research
          path: bnb_v9_cycle_status.json
          if-no-files-found: warn
