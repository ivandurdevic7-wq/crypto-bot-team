name: DEX swap valuation research
on:
  push:
    branches: [cuvar500-dex-swap-validation-20261028]
    paths: ['guardian500/dex_swap_validation.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python guardian500/dex_swap_validation.py
