name: Cuvar500 PAPER fee sensitivity
on:
  workflow_dispatch:
  push:
    branches: [cuvar500-fee-sensitivity-20261027]
    paths: ['guardian500/fee_sensitivity.py']
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python guardian500/fee_sensitivity.py
