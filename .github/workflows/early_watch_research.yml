name: Early Watch isolated research
on:
  workflow_dispatch:
  push:
    branches: [cuvar500-early-watch-20261028]
    paths: ['guardian500/early_watch.py']
permissions:
  contents: read
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python guardian500/early_watch.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: early-watch-observations
          path: guardian500/early_watch_observations.json
          if-no-files-found: ignore
