name: BNB V9 - Persistent PAPER Test
on:
  push:
    branches: [bnb-master-v9-paper-prototype]
    paths:
      - 'bnb_v9_cycle.py'
      - 'bnb_v9_risk.py'
      - '.github/workflows/bnb_v9_persist_test.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bnb-v9-persist-test
  cancel-in-progress: false
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run read-only market research / persistent PAPER state
        run: python bnb_v9_cycle.py
      - name: Save PAPER state on test branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bnb_v9_cycle_status.json
          if ! git diff --cached --quiet; then
            git commit -m "Save BNB V9 test PAPER state [skip ci]"
            git pull --rebase origin bnb-master-v9-paper-prototype
            git push origin HEAD:bnb-master-v9-paper-prototype
          fi
