name: Cuvar 500 PAPER
on:
  schedule:
    - cron: '11,26,41,56 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['guardian500/bot.py', 'guardian500/test_bot.py', '.github/workflows/guardian500.yml']
permissions:
  contents: write
concurrency:
  group: crypto-bot-team
  cancel-in-progress: false
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test accounting and risk
        run: python -m unittest discover -s guardian500 -p 'test_*.py'
      - name: Public data and virtual decisions
        run: python guardian500/bot.py
      - name: Persist ledger
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add guardian500/state.json guardian500/STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m 'Update Cuvar 500 PAPER ledger [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
