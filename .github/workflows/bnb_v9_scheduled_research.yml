name: BNB V9 - Scheduled PAPER Research (Test Branch)
on:
  workflow_dispatch:
  schedule:
    - cron: '53 * * * *'
permissions:
  contents: write
concurrency:
  group: bnb-v9-research-scheduled
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bnb-master-v9-paper-prototype
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scan real BNB prices - PAPER only, no purchases
        run: python bnb_v9_cycle.py
      - name: Commit virtual research status to test branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bnb_v9_cycle_status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update V9 PAPER research state [skip ci]"
            git pull --rebase origin bnb-master-v9-paper-prototype
            git push origin HEAD:bnb-master-v9-paper-prototype
          fi
