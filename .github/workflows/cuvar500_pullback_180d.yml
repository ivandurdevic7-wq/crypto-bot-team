name: Cuvar500 180-day pullback PAPER research
on:
  push:
    branches: [cuvar500-pullback-180d-20261027]
    paths: ['guardian500/pullback_180d.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s guardian500 -p test_pullback_research.py -v
      - run: python guardian500/pullback_180d.py
