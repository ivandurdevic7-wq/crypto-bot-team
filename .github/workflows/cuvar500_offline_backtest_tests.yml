name: Cuvar500 offline backtest unit tests
on:
  push:
    branches: [cuvar500-historical-backtest-20261027]
  pull_request:
    paths: ['guardian500/backtest_offline.py','guardian500/test_backtest_offline.py']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s guardian500 -p 'test_*.py' -v
      - run: python -m py_compile guardian500/backtest_offline.py
