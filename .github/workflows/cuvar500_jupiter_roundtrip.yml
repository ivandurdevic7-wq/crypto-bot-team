name: Cuvar 500 Jupiter roundtrip PAPER diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read-only USDC to SOL to USDC quote check
        env:
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
        run: python guardian500/jupiter_roundtrip_diagnostic.py
