name: Radar 105 research prototype
on:
  workflow_dispatch:
  push:
    branches: [radar105-research-20261028]
    paths: ['radar105/collector.py']
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python radar105/collector.py
      - uses: actions/upload-artifact@v4
        with:
          name: radar105-research-json
          path: radar105_public.json
