name: Historical DEX swap token amount verification
on:
  push:
    branches: [cuvar500-dex-swap-validation-20261028]
    paths: ['guardian500/historical_swap_assets.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python guardian500/historical_swap_assets.py
