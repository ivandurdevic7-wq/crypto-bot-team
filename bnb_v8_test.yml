name: BNB MASTER 8 - TEST ONLY
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'bnb_master_v8.py'
      - '.github/workflows/bnb_v8_test.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile script
        run: python -m py_compile bnb_master_v8.py
      - name: Run isolated paper scan (does not commit state)
        run: python bnb_master_v8.py
